# Multi-LLM Configuration for 转行帮

# Agents 1-3, 5: deep reasoning + interview (Anthropic SDK)
core:
  provider: anthropic
  model: claude-opus-4-7
  agents:
    - profile_analyzer
    - market_matcher
    - strategy_architect
    - interview_simulator

# Agent 4: text optimization (OpenRouter)
light:
  provider: openrouter
  model: google/gemma-3-27b-it:free
  agents:
    - cv_optimizer
